# Publishes to PyPI when a GitHub release is published.
# One-time setup: on pypi.org, add a "pending trusted publisher" for project
# dansur-hm with this repository, workflow "publish.yml" and environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
