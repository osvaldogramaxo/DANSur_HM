[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dansur-hm"
version = "1.0.0"
description = "DANSur: Dual-stage Artificial Neural Surrogate for higher-mode gravitational wave signals"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Osvaldo Gramaxo Freitas"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "bilby>=2.7.0",
    "gwpy>=3.0.13",
    "gwsurrogate>=1.1.8",
    "gwtools>=1.2.0",
    "h5py>=3.15.1",
    "joblib>=1.5.2",
    "lalsuite>=7.26.1",
    "matplotlib>=3.10.7",
    "numba>=0.61.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pytorch-optimizer>=3.8.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
    "torch-pca>=1.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/osvaldogramaxo/DANSur_HM"
Repository = "https://github.com/osvaldogramaxo/DANSur_HM"
"Bug Tracker" = "https://github.com/osvaldogramaxo/DANSur_HM/issues"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.hatch.build.targets.wheel]
packages = ["dansur"]
